[package]
name = "note-auto"
version = "0.9.4"
edition = "2021"
description = "note記事トレンドドリブン自動生成システム"

[[bin]]
name = "note-auto"
path = "src/main.rs"

[dependencies]
# tokio: full → 必要 features のみに絞る (依存ビルド時間削減)
# - rt-multi-thread: #[tokio::main] / tokio_cron_scheduler
# - macros: tokio::main, tokio::join!
# - signal: tokio::signal::ctrl_c
# - time: tokio::time::timeout
# - net + io-util: reqwest / tokio::io::AsyncWriteExt
# - sync: scheduler 内部
# - process: tokio::process::Command (sidecar / publish::note)
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread", "macros", "signal", "time", "net", "io-util", "sync", "process"
] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
url = "2"
regex = "1"
# quick-xml: rss / atom_syndication 経由で利用（直接呼び出し 0 件のため直接依存削除）
rss = "2"
atom_syndication = "0.12"
html-escape = "0.2"
unicode-segmentation = "1"
dotenvy = "0.15"
base64 = "0.22"
async-trait = "0.1"
slug = "0.1"
tokio-cron-scheduler = "0.13"
chrono-tz = "0.10"
hmac = "0.12"
sha1 = "0.10"
rand = "0.8"
# urlencoding は v0.9.3 DEP-1 で撤去 (url::form_urlencoded::byte_serialize で代用)

# UI/CLI 表示系（v0.7.7 で wire-up 完了 — owo-colors/console/supports-color/comfy-table/indicatif）
indicatif = "0.17"
console = "0.15"
owo-colors = "4"
comfy-table = "7"
supports-color = "3"

# v0.8.0 W7 ratatui TUI: opt-in feature (--features tui で有効化)。
# crossterm は indicatif 経由で transitively 既収録のため新規追加不要。
ratatui = { version = "0.28", optional = true }

# Windows 上で HeapAlloc より高速。fetch_all 8 ソース並列 + scoring の HashMap/HashSet
# String allocation 集中に対し 5〜15% 改善見込み。
[target.'cfg(windows)'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[features]
default = []
# `cargo build --features tui` で有効化。`note-auto tui` サブコマンドが利用可能になる。
tui = ["dep:ratatui"]

# AF3 (Phase 3 v0.9.0): criterion bench harness。将来の perf 改善時の計測基盤。
# 通常 CI では走らせず (cargo bench は時間とコストが大きい)、手動実行 or
# .github/workflows/bench.yml の workflow_dispatch から起動する設計。
[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "scoring"
harness = false

[[bench]]
name = "json_parse"
harness = false

[profile.release]
opt-level = 3
lto = "fat"            # thin → fat: クロスクレート inlining を最大化
codegen-units = 1
strip = true
panic = "abort"        # unwinding テーブル削除 (daemon panic は match で捕捉済)
incremental = false    # release ビルドのキャッシュは sccache / zigbuild 任せ
