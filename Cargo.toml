[package]
name = "note-auto"
version = "0.7.4"
edition = "2021"
description = "note記事トレンドドリブン自動生成システム"

[[bin]]
name = "note-auto"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
url = "2"
regex = "1"
quick-xml = { version = "0.36", features = ["serialize"] }
rss = "2"
atom_syndication = "0.12"
html-escape = "0.2"
unicode-segmentation = "1"
dotenvy = "0.15"
base64 = "0.22"
async-trait = "0.1"
slug = "0.1"
tokio-cron-scheduler = "0.13"
chrono-tz = "0.10"
hmac = "0.12"
sha1 = "0.10"
rand = "0.8"
urlencoding = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
