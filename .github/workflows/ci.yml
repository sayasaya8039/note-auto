name: ci

# CI1 (v0.9.0): cargo build / test / clippy + warnings 0 enforcement
#
# - clippy: -D warnings で warning を error 化
# - build: ubuntu + windows ネイティブビルド検証 (zigbuild は採用しない、CI 上は標準 cargo)
# - test: cargo test (将来 integration test 拡充の基盤)
#
# 注意: mimalloc は Cargo.toml で target='cfg(windows)' 限定なので Linux ビルドでは含まれない (OK)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  # RUSTFLAGS は build job 専用に設定 (clippy は --deny で別途強制)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: clippy + test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-lint

      - name: cargo clippy (warnings as errors)
        # CL1 (v0.9.1): clippy 拡張 lint allow を全撤去。
        # display.rs の identical if (n += 1 統合) と trends/mod.rs の type alias
        # 導入で if_same_then_else / type_complexity ともに自然解消済。
        # 全 lint default で -D warnings 強制。
        run: cargo clippy --release --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --release

  build-linux:
    name: cargo build --release (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-build-linux

      - name: cargo build
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --release

  build-windows:
    name: cargo build --release (windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-build-windows

      - name: cargo build
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --release
