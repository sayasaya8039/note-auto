name: bench

# AF3 (v0.9.0): criterion bench を手動 (workflow_dispatch) でのみ実行する。
# 通常 CI (ci.yml) では走らせない (時間 + コスト面)。
# 将来 perf 改善 PR で baseline 比較する際にこの workflow を起動。

on:
  workflow_dispatch:

jobs:
  bench:
    name: cargo bench (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench

      - name: cargo bench
        run: cargo bench --no-fail-fast
