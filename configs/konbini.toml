# コンビニ来週新商品 単独リサーチ用設定
# 用途: セブン/ローソン/ファミマ から 1 記事生成 + 公式画像 inline 利用

[trends]
sources = ["konbini"]
window_hours = 24
max_per_source = 30

[scoring.source_weights]
konbini = 2.0

[schedule]
daily_top = 1

# 単独カテゴリ実行時は publish (note 自動投稿 / X 告知) をスキップ
# 記事生成と画像取得の検証専用。実投稿は run-all.bat で行う。
[publish]
dry_run = true
