# note-auto 設定ファイル

[trends]
# 直近何時間のトレンドを見るか
window_hours = 24
# 1ソースあたり最大取得件数
max_per_source = 20
# 有効化するソース: x, google, gnews, note, hn, reddit, konbini, hyakkin
# 注: reddit は Cloudflare の TLS フィンガープリンティングにより rustls では 403 になる。
# Phase 2 で OAuth 対応予定。当面は無効のままで運用する。
# konbini: コンビニ来週新商品 (セブン/ローソン/ファミマ) $2014 現在 Grok ベース、後日 HTML スクレイプへ昇格
# hyakkin: 100均新商品 (ダイソー/セリア/キャンドゥ/ワッツ) $2014 同上
sources = ["x", "konbini", "hyakkin", "gnews", "google", "note", "hn"]
# Reddit 対象 subreddit
subreddits = ["programming", "technology", "MachineLearning", "LocalLLaMA"]
# xAI API キーは環境変数 XAI_API_KEY で注入推奨
# xai_api_key は環境変数 XAI_API_KEY で設定推奨

[scoring]
# 重複判定の類似度閾値 (0-1)
dedup_threshold = 0.65

[scoring.source_weights]
# X 最優先化 + 生活トレンド (コンビニ/100均) を新規重視、Google Trends は減衰
x = 2.0       # X さらに最優先 (多カテゴリ話題性)
gnews = 1.4   # Google News 日本版 (top/world/nation/business/ent/science/sports/health)
konbini = 1.3 # コンビニ来週新商品 (セブン/ローソン/ファミマ)
hyakkin = 1.2 # 100均新商品 (ダイソー/セリア/キャンドゥ/ワッツ)
google = 0.7  # Google Trends 日本 (検索トレンド) $2014 生活トレンドへ譲る
note = 0.7    # note は優先度低め
reddit = 0.8
hn = 0.4      # 海外 tech 特化、影響最小

[writer]
# API キーは環境変数 or .env 推奨
# anthropic_api_key は環境変数 ANTHROPIC_API_KEY で設定推奨
# openai_api_key は環境変数 OPENAI_API_KEY で設定推奨

# 2026-04 時点の最新モデル
opus_model = "claude-opus-4-7"
haiku_model = "claude-haiku-4-5-20251001"
grok_model = "grok-3-latest"

# 画像プロバイダ: "pollo" (推奨、OpenAI billing制約なし) or "openai"
image_provider = "pollo"
# pollo: "openai-gpt-image-2-0" / "openai-gpt-image-1-5" / "gpt-4o" / "dall-e-3" / "flux-2-max" 等
# openai 直: "gpt-image-1" / "dall-e-3"
image_model = "openai-gpt-image-2-0"
# pollo: "16:9" / "1:1" / "9:16"  |  openai: "1536x1024" / "1024x1024"
image_size = "16:9"

target_chars = 3000
max_tokens = 8000
# dry_run = true なら API 呼び出しをスキップしスタブで代替 (開発用)
dry_run = false

[publish]
# Playwright サイドカー (note.com 自動投稿)
playwright_script = "scripts/note-publish.mjs"
playwright_runtime = "node"  # node (推奨) / bun / "npx tsx" など. bun は Windows で remote-debugging-pipe 問題あり
cookie_dir = ".cookies"
# true で公開、false で下書き保存のみ
note_publish = false
# X 告知投稿を有効化
x_announce = true
# API キーは環境変数 or .env 推奨
# X OAuth キーは環境変数 X_API_KEY / X_API_SECRET / X_ACCESS_TOKEN / X_ACCESS_SECRET で設定
# slack_webhook_url は環境変数 SLACK_WEBHOOK_URL で設定
# dry_run = true なら外部呼び出しをスキップ
dry_run = false

[schedule]
# 毎日 07:00 JST (6フィールド cron: sec min hour day month dow)
cron = "0 0 7 * * *"
timezone = "Asia/Tokyo"
daily_top = 3
